<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee & Bread - Fresh Catch</title>

    <!-- CSS Link: Points into the css/ folder -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="game-container">
        <h1>COFFEE & BREAD</h1>
        <h2>Fresh Catch</h2>

        <div class="game-info">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">❤️ ❤️ ❤️</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="instructions">
            <p>Use the ← and → arrow keys to move the basket.</p>
            <p>Catch fresh ingredients and avoid spoiled food!</p>
        </div>
    </div>

    <!-- JavaScript Link: Points into the js/ folder -->
    <script src="js/game.js"></script>
</body>
</html>
