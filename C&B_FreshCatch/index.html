<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pupusa Catcher Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <h1>Coffee & Bread</h1>
        <h2>Pupusa Catcher Game</h2>
        
        <div class="game-info">
            <div id="score-container">Score: <span id="score">0</span></div>
            <div id="lives-container">Lives: <span id="lives">❤️ ❤️ ❤️</span></div>
        </div>

        <!-- Canvas resolution scaled for sharp mobile/desktop rendering -->
        <canvas id="gameCanvas" width="800" height="700"></canvas>

        <div class="instructions">
            <p>Drag your finger or use Left/Right Arrow Keys to move</p>
            <p>Tap or press R to restart when game over</p>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
